databases:
  - name: recruitr-workspaces-db
    databaseName: vikunja
    user: vikunja
    plan: free

services:
  - type: web
    name: recruitr-workspaces
    env: image
    image:
      url: vikunja/vikunja:latest
    plan: free
    region: oregon
    envVars:
      - key: VIKUNJA_DATABASE_TYPE
        value: postgres
      - key: VIKUNJA_DATABASE_HOST
        fromDatabase:
          name: recruitr-workspaces-db
          property: host
      - key: VIKUNJA_DATABASE_PASSWORD
        fromDatabase:
          name: recruitr-workspaces-db
          property: password
      - key: VIKUNJA_DATABASE_USER
        fromDatabase:
          name: recruitr-workspaces-db
          property: user
      - key: VIKUNJA_DATABASE_DATABASE
        fromDatabase:
          name: recruitr-workspaces-db
          property: database
      - key: VIKUNJA_SERVICE_NAME
        value: Recruitr Workspaces
      - key: VIKUNJA_SERVICE_PUBLICURL
        value: https://recruitr-workspaces.onrender.com
